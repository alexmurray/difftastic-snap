project: difftastic-snap

backends:
  # spread integration for image-garden(1) (https://gitlab.com/zygoon/image-garden)
  # - downloads and caches official cloud images and boots them under
  # QEMU/KVM, so unlike the old qemu backend there's no manual image-baking.
  # Needs the image-garden snap (`snap install image-garden`) and /dev/kvm
  # access.
  garden:
    type: adhoc
    allocate: |
      if [ -n "${SPREAD_HOST_PATH-}" ]; then
        PATH="${SPREAD_HOST_PATH}"
      fi
      exec image-garden allocate --spread "$SPREAD_SYSTEM"."$(uname -m)"
    discard: |
      if [ -n "${SPREAD_HOST_PATH-}" ]; then
        PATH="${SPREAD_HOST_PATH}"
      fi
      exec image-garden discard "$SPREAD_SYSTEM_ADDRESS"
    systems:
      - ubuntu-cloud-24.04:
          username: ubuntu
          password: ubuntu

path: /spread/difftastic-snap

exclude:
  - .git
  - .github
  - difftastic*.snap

environment:
  CHANNEL/latest_stable: latest/stable
  CHANNEL/latest_candidate: latest/candidate
  CHANNEL/latest_beta: latest/beta
  CHANNEL/latest_edge: latest/edge
  SNAP: difftastic

suites:
  tests/:
    summary: spread tests
    prepare: |
      # ensure machine is up to date
      export DEBIAN_FRONTEND=noninteractive
      # use apt-get to support older Ubuntu releases
      apt-get update
      apt-get -o Dpkg::Options::="--force-confold" -o Dpkg::Options::="--force-confdef" upgrade -y
      # use apt-get to support older Ubuntu releases
      apt-get autoremove --purge -y
      apt install -y snapd git

      # configure git
      git config --global user.email "you@example.com"
      git config --global user.name "You"

    prepare-each: |
      snap install difftastic --channel $CHANNEL

    restore-each: |
      snap remove difftastic
      rm -rf snap/difftastic




